<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Carrito</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body>
    <header id="header" class="header"> <!-- header con el icono y panel del carrito -->
        <div class="container">
            <div class="row">
                <div class="two columns u-pull-right">
                    <ul>
                        <li class="submenu">
                            <button id="img-carrito" class="boton-carrito" aria-label="Abrir carrito">
                                <img src="img/carrito-icon.svg" alt="Carrito de compras" width="24" height="24">
                                <span id="badge-carrito">0</span>
                            </button>
                            <div id="carrito">
                                <div id="lista-carrito"></div>
                                <p id="total-carrito">Total: $0</p>
                                <a href="#" id="pagar" class="button u-full-width">Pagar</a>
                                <a href="pages/carrito.html" class="button u-full-width">Ver carrito</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div id="hero"> <!-- seccion principal con el logo -->
        <div class="container">
            <div class="row">
                <div class="six columns">

                </div>
            </div>
        </div>
    </div>

    <div id="lista-libros" class="container"> <!-- listado de productos -->
        <h1 id="encabezado" class="encabezado">Venta de Libros</h1>
        <div class="row">
            <div class="four columns">
                <div class="card">
                    <img src="img/libro_1.jpg" width="50%" class="imagen-curso u-full-width">
                    <div class="info-card">
                        <h4>Java 1</h4>
                        <p>Pedro Torres</p>
                        <span class="estrellas">★★★★★</span>
                        <p class="precio">$100 <span class="u-pull-right ">$75</span></p>
                        <a href="#" class="u-full-width button-primary button input agregar-carrito" data-id="1">Agregar
                            Al Carrito</a>
                    </div>
                </div> <!--.card-->
            </div>
            <div class="four columns">
                <div class="card">
                    <img src="img/libro_2.jpg" class="imagen-curso u-full-width">
                    <div class="info-card">
                        <h4>Java 2</h4>
                        <p>Pedro Torres</p>
                        <span class="estrellas">★★★★★</span>
                        <p class="precio">$300 <span class="u-pull-right ">$215</span></p>
                        <a href="#" class="u-full-width button-primary button input agregar-carrito" data-id="2">Agregar
                            Al Carrito</a>
                    </div>
                </div>
            </div>
            <div class="four columns">
                <div class="card">
                    <img src="img/libro_3.jpg" class="imagen-curso u-full-width">
                    <div class="info-card">
                        <h4>Java 3</h4>
                        <p>Pedro Torres</p>
                        <span class="estrellas">★★★★★</span>
                        <p class="precio">$300 <span class="u-pull-right ">$215</span></p>
                        <a href="#" class="u-full-width button-primary button input agregar-carrito" data-id="3">Agregar
                            Al Carrito</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer" class="footer"> <!-- pie de pagina -->
        <div class="container">
            <div class="row">
                <p>Marca Registrada</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script> <!-- app: arranque (importa modelo y vista) -->

</body>

</html>
