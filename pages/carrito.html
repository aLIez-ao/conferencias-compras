<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/skeleton.css">
    <link rel="stylesheet" href="../css/custom.css">
</head>

<body>
    <header id="header" class="header">
        <div class="container">
            <div class="navegacion">
                <!-- Logotipo -->
                <a href="../index.html" class="logo">
                    <span class="logo-icono">C</span>
                    <span>Conferencify</span>
                </a>

                <!-- Menú de navegación -->
                <nav class="menu-principal">
                    <a href="../index.html" class="enlace_inicio">Inicio</a>
                    <a href="../index.html#lista-conferencias" class="enlace_conferencias">Conferencias</a>
                    <a href="#footer" class="enlace_footer">Acerca de</a>

                    <!-- Ticket integrado como enlace de texto en el menú -->
                    <div class="submenu-ticketgen-container">
                        <button id="btn-menu-ticketgen" class="enlace_ticketgen">Ticket</button>
                        <div id="panel-ticketgen" class="panel-ticketgen-flotante">
                            <div id="contenido-ticketgen-menu"></div>
                        </div>
                    </div>
                </nav>

                <!-- Carrito -->
                <div class="acciones-header">
                    <ul>
                        <li class="submenu">
                            <button id="img-carrito" class="boton-carrito" aria-label="Abrir carrito">
                                <img src="../img/carrito-icon.svg" alt="Carrito de compras" width="32" height="32">
                                <span id="badge-carrito">0</span>
                            </button>

                            <!-- Panel desplegable del carrito -->
                            <div id="carrito">
                                <div id="lista-carrito"></div>
                                <p id="total-carrito">Total: $0</p>
                                <a href="../index.html#pagar" class="button u-full-width">Finalizar compra</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- DETALLE DEL CARRITO -->
    <main class="container carrito-pagina">
        <h1 class="encabezado">Mi Carrito</h1>

        <div id="lista-carrito-detalle"></div>

        <div class="carrito-resumen">
            <p id="total-detalle">Total: $0</p>
        </div>

        <div class="carrito-acciones">
            <a href="#" id="vaciar-carrito" class="button">Vaciar Carrito</a>
            <a href="../index.html" class="button">Seguir comprando</a>
            <a href="../index.html#pagar" class="button btn-finalizar">Finalizar compra</a>
        </div>
    </main>

    <!-- Pie de pagina -->
    <footer id="footer" class="footer">
        <div class="container">
            <div class="row">
                <p>© 2026 Conferencify. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../js/app.js"></script> <!-- app: arranque (importa modelo y vista) -->

</body>

</html>
