<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detalle de la conferencia</title>
    <link rel="icon" type="image/png" href="../img/icon.png">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/skeleton.css">
    <link rel="stylesheet" href="../css/custom.css">
</head>

<body>
    <header id="header" class="header">
        <div class="container">
            <div class="navegacion">
                <!-- Logotipo -->
                <a href="../index.html" class="logo">
                    <img src="../img/icon.png" alt="Conferencify" class="logo-icono">
                    <span>Conferencify</span>
                </a>

                <!-- Menú de navegación -->
                <nav class="menu-principal">
                    <a href="../index.html#lista-conferencias">Conferencias</a>
                    <a href="carrito.html">Mi Carrito</a>
                    <a href="ticket.html">Mi Ticket</a>
                    <a href="../index.html#footer">Acerca de</a>
                </nav>

                <!-- Carrito -->
                <div class="acciones-header">
                    <ul>
                        <li class="submenu">
                            <button id="img-carrito" class="boton-carrito" aria-label="Abrir carrito">
                                <img src="../img/carrito-icon.svg" alt="Carrito de compras" width="32" height="32">
                                <span id="badge-carrito">0</span>
                            </button>

                            <!-- Panel desplegable del carrito -->
                            <div id="carrito">
                                <div id="lista-carrito"></div>
                                <p id="total-carrito">Total: $0</p>
                                <a href="compra.html" class="button u-full-width">Finalizar compra</a>
                                <a href="carrito.html" class="button u-full-width">Ver carrito</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- SECCIÓN DE DETALLE DE LA CONFERENCIA (se llena desde el JSON) -->
    <div class="container detalle-conferencia">
        <div id="detalle-conferencia">
            <p class="conferencia-vacia">Cargando conferencia...</p>
        </div>
    </div>

    <!-- Pie de pagina -->
    <footer id="footer" class="footer">
        <div class="container">
            <div class="row">
                <p>© 2026 Conferencify. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../js/app.js"></script> <!-- app: arranque (importa modelo y vista) -->

</body>
</html>
